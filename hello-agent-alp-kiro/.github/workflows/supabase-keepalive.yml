name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping search_knowledge_db
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST https://hello-agent-alp-kiro.onrender.com/tools/search_knowledge_db \
            -H "Content-Type: application/json" \
            -d '{"input": {"query": "keepalive ping", "top_k": 1}}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"count"'
